<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SecureShare{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'shares/styles.css' %}">
</head>
<body class="bg-light">
  <div class="ambient-grid" aria-hidden="true"></div>
  <nav class="navbar ss-navbar">
    <div class="container ss-nav-inner">
      <a class="navbar-brand ss-brand" href="{% url 'upload' %}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 5.5 5.8v5.1c0 4.2 2.7 7.9 6.5 9.1 3.8-1.2 6.5-4.9 6.5-9.1V5.8L12 3Zm0 3.1 3.6 1.6v3.2c0 2.5-1.4 4.8-3.6 5.9-2.2-1.1-3.6-3.4-3.6-5.9V7.7L12 6.1Z"/></svg>
        </span>
        <span>Secure<span>Share</span></span>
      </a>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <a class="nav-link-modern" href="{% url 'library' %}">My documents</a>
          <a class="nav-link-modern" href="{% url 'dashboard' %}">Share history</a>
          <form method="post" action="{% url 'account_logout' %}" class="m-0">
            {% csrf_token %}
            <button class="nav-button nav-button-ghost" type="submit">Log out</button>
          </form>
        {% else %}
          <a class="nav-button nav-button-ghost" href="{% url 'account_login' %}">Log in</a>
          <a class="nav-button nav-button-primary" href="{% url 'account_signup' %}">Get started</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container ss-main">
    {% for message in messages %}
      <div class="ss-alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
        <span class="ss-alert-dot"></span>{{ message }}
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll('.form-check-input').forEach(function (el) {
      el.classList.add('ss-switch');
    });
  </script>
</body>
</html>
