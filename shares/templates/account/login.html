{% extends "shares/base.html" %}
{% block title %}Login - SecureShare{% endblock %}
{% block content %}
<div class="row justify-content-center auth-shell"><div class="col-md-5"><div class="card auth-card">
  <div class="document-icon mb-3">&#128274;</div>
  <h1 class="h3 mb-2">Welcome back</h1>
  <p class="text-muted mb-4">Sign in to manage and share encrypted documents.</p>
  <form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    {% if redirect_field_value %}<input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">{% endif %}
    <button class="btn btn-primary w-100" type="submit">Login</button>
  </form>
  <p class="text-center mt-3 mb-0">No account? <a href="{% url 'account_signup' %}">Register</a></p>
</div></div></div></div>
{% endblock %}
